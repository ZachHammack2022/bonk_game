name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # pygame runs without a screen or sound card
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -q

  training:
    # Makes sure the full training stack installs and can actually train.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install training stack (CPU-only torch keeps this fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Run the tests, including the ones that need stable-baselines3
        run: |
          pip install pytest
          python -m pytest -q

      - name: Check every map's env with stable-baselines3
        run: python -m bonk_game.envs.check_env

      - name: Tiny training run
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          python "$GITHUB_WORKSPACE/main.py" --train platform --steps 2000
          python "$GITHUB_WORKSPACE/main.py" --train platform --steps 2000 --opponents bad

  web:
    # The web version in a real browser: two players, a full match,
    # a reload mid-match, results and a phone-sized lobby.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: Install the server (no pygame, no training stack)
        run: pip install -r requirements-server.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Browser test
        run: node tests/web/e2e.js
        env:
          E2E_SHOTS: e2e-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore
