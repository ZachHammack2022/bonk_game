name: tests

# Pull requests run only the jobs their changes need (see "changes" below).
# Everything runs:
#   - on main, after every merge
#   - on a pull request labelled "full-ci" (add it just before merging)
#   - in a merge queue, if one is turned on
#   - when started by hand (Actions -> tests -> Run workflow)
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_dispatch:

# A new push to a pull request cancels its older run (never on main)
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which jobs this change needs. Opinionated on purpose: when unsure, the
    # test job runs (it's quick); the full set runs before merging anyway.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.pick.outputs.test }}
      web: ${{ steps.pick.outputs.web }}
      training: ${{ steps.pick.outputs.training }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$FULL" = "true" ]; then
            echo "Running everything ($EVENT, full-ci: $FULL)"
            printf 'test=true\nweb=true\ntraining=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          echo "Changed:"; echo "$files" | sed 's/^/  /'
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          ci='^\.github/workflows/|^constraints\.txt$'
          # The physics, maps and bots are shared by everything
          physics='^bonk_game/(envs|maps)/|^bonk_game/ui/bot\.py$'
          test=$(has "$ci|$physics|\.py$|^tests/|^requirements|^bonk_game/server/static/")
          web=$(has "$ci|$physics|^bonk_game/server/|^bonk_game/ui/theme\.py$|^tests/web/|^requirements-server\.txt$|^package(-lock)?\.json$")
          training=$(has "$ci|$physics|^main\.py$|^requirements\.txt$|^setup\.py$")
          echo "test=$test web=$web training=$training"
          printf 'test=%s\nweb=%s\ntraining=%s\n' "$test" "$web" "$training" >> "$GITHUB_OUTPUT"

  lint:
    # Quick, so it runs on every change: ruff for the Python, eslint for
    # the browser client (config: pyproject.toml, eslint.config.js)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff
        run: |
          pip install "ruff==$(grep -Po '^ruff==\K.*' constraints.txt)"
          ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: eslint
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx eslint .

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # pygame runs without a screen or sound card
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            constraints.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt -c constraints.txt

      - name: Run tests
        run: python -m pytest -q

  training:
    # Makes sure the full training stack installs and can actually train.
    needs: changes
    if: needs.changes.outputs.training == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      # The installed packages themselves (PyTorch is most of the time)
      - uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: training-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt', 'setup.py', 'constraints.txt') }}

      - name: Install training stack (CPU-only torch keeps this fast)
        run: |
          pip install "torch==$(grep -Po '^torch==\K.*' constraints.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -c constraints.txt
          pip install -e . -c constraints.txt

      - name: Run the tests, including the ones that need stable-baselines3
        run: |
          pip install pytest -c constraints.txt
          python -m pytest -q

      - name: Check every map's env with stable-baselines3
        run: python -m bonk_game.envs.check_env

      - name: Tiny training run
        run: |
          mkdir -p /tmp/run && cd /tmp/run
          python "$GITHUB_WORKSPACE/main.py" --train platform --steps 2000
          python "$GITHUB_WORKSPACE/main.py" --train platform --steps 2000 --opponents bad

  web:
    # The web version in a real browser: two players, a full match,
    # a reload mid-match, results and a phone-sized lobby.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-server.txt
            constraints.txt

      - name: Install the server (no pygame, no training stack)
        run: pip install -r requirements-server.txt -c constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.48.2-${{ runner.os }}

      - name: Install Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser test
        run: node tests/web/e2e.js
        env:
          E2E_SHOTS: e2e-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore

  done:
    # One check that says whether everything this change needed passed
    # (skipped jobs count as passed), for branch protection to require.
    needs: [changes, lint, test, training, web]
    # (not when the whole run was cancelled by a newer push: that's not a failure)
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: All needed jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job $r"; exit 1 ;; esac
          done

  merge-ready:
    # The check main requires: every job ran (not just the ones this change
    # needed) and passed. On a pull request that means the "full-ci" label.
    needs: [changes, lint, test, training, web]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Everything ran and passed
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          if [ "$EVENT" = "pull_request" ] && [ "$FULL" != "true" ]; then
            echo "::error::Only the jobs this change needs ran. Add the full-ci label to run everything before merging."
            exit 1
          fi
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "A job $r"; exit 1; }
          done
