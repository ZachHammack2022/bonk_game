name: deploy

# Production: every merge to main deploys itself, once main's tests have
# passed on that commit (tests.yml runs everything on main; this waits for
# it). Red tests: nothing is deployed.
#
# By hand: Actions -> deploy -> Run workflow, to staging or production
# (production still only if the tests passed on main's latest commit).
#
# Setup, once (README: "Deploys"):
#   - the repository secret FLY_API_TOKEN (fly tokens create deploy -a bonk-game)
#   - optionally the repository variables STAGING_APP and PRODUCTION_APP
#     (defaults: bonk-game-staging and bonk-game)
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy main
        type: choice
        options: [staging, production]
        default: production

# One deploy at a time per app; they queue up in order
concurrency:
  group: deploy-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

# Read-only: the deploy uses FLY_API_TOKEN, not GitHub's token
permissions:
  contents: read
  actions: read   # (tests' results on main, for production)

jobs:
  deploy:
    # (after a merge: only when main's tests passed, and only for a push to
    # main, not the tests run on a pull request's branch)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event.inputs.target || 'production' }}
      url: https://${{ steps.app.outputs.name }}.fly.dev
    steps:
      # The commit the tests passed on (after a merge), or main's latest (by hand)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: app
        env:
          TARGET: ${{ github.event.inputs.target || 'production' }}
          STAGING: ${{ vars.STAGING_APP || 'bonk-game-staging' }}
          PRODUCTION: ${{ vars.PRODUCTION_APP || 'bonk-game' }}
          HAS_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
          REF: ${{ github.ref }}
        run: |
          if [ "$TARGET" = "production" ]; then app="$PRODUCTION"; else app="$STAGING"; fi
          echo "name=$app" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::No FLY_API_TOKEN secret yet, so nothing was deployed (README: Staging and deploys)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Deploys are from main only."
            exit 1
          fi

      # (by hand; after a merge, this run started because they passed)
      - name: Production needs main's tests to have passed on this commit
        if: steps.app.outputs.skip != 'true' && github.event.inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          result="$(gh run list --workflow tests.yml --commit "$SHA" --event push \
            --json conclusion --jq '.[0].conclusion // "none"')"
          echo "tests on $SHA: $result"
          if [ "$result" != "success" ]; then
            echo "::error::The tests haven't passed on this commit of main ($result). Fix main, or wait for its tests to finish."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: steps.app.outputs.skip != 'true'

      - name: Deploy
        if: steps.app.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.app.outputs.name }}
        # One machine: rooms live in memory. Matches being played finish first.
        run: |
          flyctl deploy --remote-only -a "$APP" --ha=false
          flyctl scale count 1 -a "$APP" --yes

      - uses: actions/setup-python@v7
        if: steps.app.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-server.txt
            constraints.txt

      - name: Smoke test (load the page, make a room, play against a bot)
        if: steps.app.outputs.skip != 'true'
        env:
          APP: ${{ steps.app.outputs.name }}
        run: |
          pip install -r requirements-server.txt -c constraints.txt
          python -m bonk_game.server.smoke "https://$APP.fly.dev"
