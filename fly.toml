# fly.toml app configuration file generated for bonk-game on 2026-11-04T00:10:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bonk-game'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '2m10s'

[build]

[env]
  BONK_TRUST_PROXY = '1'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
