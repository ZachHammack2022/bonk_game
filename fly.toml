# Fly.io config for the bonk server. Deploy with ./deploy/fly.sh <app-name>
# (see "Hosting it on Fly.io" in the README), or from Fly's dashboard.

app = "bonk-game"               # https://bonk-game.fly.dev; fly.sh's <app-name> overrides it
primary_region = "iad"          # Virginia; pick the region nearest your players
kill_signal = "SIGTERM"         # the server finishes running matches, then exits
kill_timeout = 130              # seconds: a bit longer than BONK_DRAIN_SECONDS (120)

[build]                         # builds the Dockerfile

[env]
  PORT = "8000"
  BONK_TRUST_PROXY = "1"        # Fly's proxy says who each visitor is (Fly-Client-IP)
  BONK_DB = "/data/bonk.db"     # accounts (only used once GOOGLE_CLIENT_ID/SECRET are set)
  BONK_METRICS_DB = "/data/metrics.db"  # the server's numbers every minute, for /admin
  # Proves to Google that we own bonk-game.fly.dev (Search Console's HTML tag;
  # it's in the page for anyone to see, so not a secret)
  BONK_GOOGLE_SITE_VERIFICATION = "p9aoem1ei899-eutjEvSrBfigVHgTGshzHtI1edyHUI"

# Accounts live in a SQLite file on this volume, so they outlive deploys.
# Make it once: fly volumes create bonk_data --size 1 --region iad
[mounts]
  source = "bonk_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true            # https:// pages, so the browser uses wss://
  # Rooms live in memory: one machine, always the same one. It stops when
  # nobody's connected for a while and starts again on the next visit (an
  # open game counts as connected).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"        # each browser holds one WebSocket
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"        # about 10 full rooms of 10 (README: "How big a server?")
  memory = "512mb"
